# clingon's private tmux config, fed to its own tmux server at startup
# (never written to disk), so ~/.tmux.conf and any other tmux server are
# never touched.
# Layout-specific bindings (S-Tab, resize) are set at launch,
# once the pane ids are known.

if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'
# 24-bit colour is turned on at launch, only for terminals that have it
# (COLORTERM=truecolor); others get the nearest of 256 colours.

set -g escape-time 0
set -g mouse on
set -g status off
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
# The window's title is clingon's, whatever the shell that started it set.
set -g set-titles on
set -g set-titles-string 'clingon'

# The active pane's whole frame is highlighted (not tmux's default of half
# the divider when there are two panes). -q: older tmux lacks the option.
set -gq pane-border-indicators off
set -g pane-border-lines single
set -g pane-border-style 'fg=colour60,bg=default'
set -g pane-active-border-style 'fg=colour212,bg=default'

# Colours are clingon's palette (internal/ui/styles.go), by their number
# of the 256 standard ones, which every terminal shows the same. The
# background and text are left to the terminal: clingon's window profile
# sets them to its exact ink, which tmux, painting them itself, would round
# to the nearest grey.
set -g window-style 'default'
set -g window-active-style 'default'

# Clicks on the blank spacer panes that draw the frames do nothing.
bind -n MouseDown1Pane if -F -t = '#{@spacer}' '' 'select-pane -t = ; send-keys -M'

# Closing the terminal window (rather than pressing Esc) ends the session
# too, instead of leaving it running unseen. Set once attached: the session
# starts out detached while clingon lays it out.
set-hook -g client-attached 'set destroy-unattached on'

# Whichever side exits, the whole session goes with it.
set-hook -g pane-exited 'kill-session'
