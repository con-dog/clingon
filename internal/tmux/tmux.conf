# clingon's private tmux config, fed to its own tmux server at startup
# (never written to disk), so ~/.tmux.conf and any other tmux server are
# never touched.
# Layout-specific bindings (S-Tab, resize) are set at launch,
# once the pane ids are known.

if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'
# 24-bit colour is turned on at launch, only for terminals that have it
# (COLORTERM=truecolor); others get the nearest of 256 colours.

set -g escape-time 0
set -g mouse on
set -g status off
set -g focus-events on
# The shell's cursor blinks, like the menu's: a blinking block, whose colour
# the window profile sets. -q: older tmux lacks the option.
set -gq cursor-style blinking-block
set -g history-limit 50000
set -g set-clipboard on
# The window's title is clingon's, whatever the shell that started it set.
set -g set-titles on
set -g set-titles-string 'clingon'

# The pane with focus has its whole frame in the palette's purple, the
# headings' colour: part of what makes the window clingon's, and no brighter
# than the everyday state it marks. Pink stays the cursor's alone. The other
# panes' frames are the quiet Shade.
#
# While the AI drives, focus goes with it, to the pane it's working in (the
# menu's, or the shell's while it fills in the pack form there), and that
# frame is the AI's gold, as its chip is: brightness is for the moments that
# want a look. tmux.go's AIDriving does it, and gives the window the key
# table below for as long: esc stops the AI from wherever focus is, and no
# other key of yours lands in what it's typing into.
#
# The AI's panel under the shell is part of the shell's side of the window:
# a frame round the shell goes round both. tmux only lights the borders of
# the pane with focus, so the panel's own (@clingon-with-shell, set as it
# opens) are lit by this style while focus is in the shell (@clingon-in-shell,
# kept by a hook: tmux.go's layout). -q: older tmux lacks the option.
set -gq pane-border-indicators off
set -g pane-border-lines single
set -g @clingon-in-shell 0
set -g @clingon-ai-pane ''
set -g pane-border-style '#{?#{&&:#{@clingon-with-shell},#{@clingon-in-shell}},#{?#{@clingon-ai-pane},fg=colour221,fg=colour99},fg=colour238},bg=default'
set -g pane-active-border-style '#{?#{@clingon-ai-pane},fg=colour221,fg=colour99},bg=default'

# Colours are clingon's palette (internal/palette), by their number
# of the 256 standard ones, which every terminal shows the same. The
# background and text are left to the terminal: clingon's window profile
# sets them to its exact ink, which tmux, painting them itself, would round
# to the nearest grey.
set -g window-style 'default'
set -g window-active-style 'default'

# No pane can be resized: clingon's layout is fixed, the menu a third of the
# window, the shell beside it, the AI's panel under it. No border can be
# dragged, and tmux's own keys that resize, zoom or re-lay the panes are off.
unbind -n MouseDrag1Border
unbind -n MouseDown1Border
unbind -n M-MouseDrag1Border
unbind -n M-MouseDrag1Pane
# Newer tmux's border buttons (float, zoom, kill) and its right-click pane
# menu (zoom, swap, kill) are off too; a right click still reaches a program
# in the shell that takes the mouse. -q: older tmux lacks the keys.
unbind -qn MouseDown1Control7
unbind -qn MouseDown1Control8
unbind -qn MouseDown1Control9
unbind -n M-MouseDown3Pane
bind -n MouseDown3Pane if -F -t = '#{mouse_any_flag}' 'send-keys -M -t =' 
unbind -T prefix C-Up
unbind -T prefix C-Down
unbind -T prefix C-Left
unbind -T prefix C-Right
unbind -T prefix M-Up
unbind -T prefix M-Down
unbind -T prefix M-Left
unbind -T prefix M-Right
unbind -T prefix z
unbind -T prefix Space
unbind -T prefix M-1
unbind -T prefix M-2
unbind -T prefix M-3
unbind -T prefix M-4
unbind -T prefix M-5

# Clicks on the blank spacer panes that draw the frames do nothing.
bind -n MouseDown1Pane if -F -t = '#{@spacer}' '' 'select-pane -t = ; send-keys -M'

# Closing the terminal window (rather than pressing Esc) ends the session
# too, instead of leaving it running unseen. Set once attached: the session
# starts out detached while clingon lays it out.
set-hook -g client-attached 'set destroy-unattached on'

# Whichever side exits, the whole session goes with it.
set-hook -g pane-exited 'kill-session'
