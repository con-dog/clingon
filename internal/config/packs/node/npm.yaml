# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: npm
description: Install, add, remove, update and audit packages, and run scripts and tests with npm
requires: [npm]
when: [package-lock.json, npm-shrinkwrap.json]
commands:
  - name: Add a package
    id: node-b923d3bf
    cmd: npm install <flags> <package>
    desc: "Adds a package to package.json and installs it."
    args:
      - name: package
        desc: "Adding <package>."
      - name: flags
        type: flags
        options:
          - { value: -D, label: dev dependency }
  - name: Clean install (CI)
    id: node-767206f2
    cmd: npm ci
    desc: "Deletes node_modules and installs exactly what package-lock.json lists. Best for CI and clean checkouts."
    risk: warn
  - name: Clean reinstall
    id: node-f655ba84
    cmd: rm -rf node_modules && npm install
    desc: "Deletes node_modules and installs every dependency again from scratch."
    risk: warn
  - name: Install dependencies
    id: node-f076916a
    cmd: npm install
    desc: "Installs every dependency in package.json."
  - name: Outdated packages
    id: node-690e4eea
    cmd: npm outdated
    desc: "Lists dependencies with newer versions available."
  - name: Remove a package
    id: node-93ff0469
    cmd: npm uninstall <package>
    desc: "Takes a dependency out of package.json and node_modules."
    risk: warn
    args:
      - name: package
        quote: true
        desc: "Removing <package>."
        placeholder: "lodash"
  - name: Run a script
    id: node-939f6622
    cmd: npm run <script>
    desc: "Runs one of the scripts in package.json."
    args:
      - name: script
        quote: true
        placeholder: "test"
  - name: Run tests
    id: node-8cab96ab
    cmd: npm test
    desc: "Runs the project's test script."
  - name: Security audit
    id: node-6adb17c1
    cmd: npm audit
    desc: "Checks your dependencies for known security problems."
  - name: Top-level dependencies
    id: node-d7fb5474
    cmd: npm ls --depth=0
    desc: "Lists the project's direct dependencies and the versions installed."
  - name: Update dependencies
    id: node-d7160988
    cmd: npm update
    desc: "Updates dependencies to the newest versions package.json allows."
    risk: warn
