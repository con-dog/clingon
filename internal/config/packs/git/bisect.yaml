# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Bisect
description: Track down the commit that broke something by marking commits good or bad
when: [.git]
commands:
  - name: Start bisecting
    id: git-bd62a5b8
    cmd: git bisect start && git bisect bad && git bisect good <commit>
    desc: "Finds the commit that broke something by binary search: this commit is marked bad, and you pick one that was still good."
    args:
      - name: commit
        quote: true
        desc: "<commit> was still good."
        placeholder: "a1b2c3d or HEAD~1"
  - name: This one's bad
    id: git-0f2ac587
    cmd: git bisect bad
    desc: "Marks the commit you're on as broken, and checks out the next one to test."
  - name: This one's good
    id: git-3742f9bd
    cmd: git bisect good
    desc: "Marks the commit you're on as working, and checks out the next one to test."
  - name: Stop bisecting
    id: git-90ce6f5f
    cmd: git bisect reset
    desc: "Ends the search and takes you back to where you started."
