# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Setup
description: Clone or start a repo, and set your name, email, editor, commit signing and recommended settings
commands:
  - name: Clone a repo
    id: git-69bc4fa1
    cmd: git clone <url>
    desc: "Downloads a repository and its history into a new folder here."
    args:
      - name: url
        quote: true
        desc: "From <url>."
        placeholder: git@github.com:owner/repo.git
  - name: Start a repo here
    id: git-b668b26b
    cmd: git init
    desc: "Turns this folder into a new Git repository."
  - name: Recommended settings
    id: git-6813d631
    cmd: <settings>
    desc: "Turns on settings most people want, for every repository."
    args:
      - name: settings
        type: flags
        join: " && "
        options:
          - { value: git config --global fetch.prune true, label: fetch forgets branches deleted on the remote }
          - { value: git config --global init.defaultBranch main, label: new repos start on main }
          - { value: git config --global pull.rebase true, label: pull rebases instead of merging }
          - { value: git config --global push.autoSetupRemote true, label: first push of a branch sets up tracking }
          - { value: git config --global rerere.enabled true, label: remember how you fixed a conflict }
        default: git config --global fetch.prune true && git config --global init.defaultBranch main && git config --global pull.rebase true && git config --global push.autoSetupRemote true
  - name: Set your email
    id: git-2d184897
    cmd: git config --global user.email <email>
    desc: "Sets the email address recorded on your commits. Use the one your Git host knows you by."
    args:
      - name: email
        quote: true
        desc: "To <email>."
        placeholder: you@example.com
  - name: Set your name
    id: git-1e9201c3
    cmd: git config --global user.name <name>
    desc: "Sets the name recorded on your commits."
    args:
      - name: name
        quote: true
        desc: "To \"<name>\"."
        placeholder: Your Name
  - name: Set your editor
    id: git-0303a1f8
    cmd: git config --global core.editor <editor>
    desc: "Sets the editor Git opens for commit messages and rebases."
    args:
      - name: editor
        desc: "To <editor>."
        options:
          - { value: "'code --wait'", label: VS Code }
          - micro
          - nano
          - nvim
          - vim
        default: nano
  - name: Sign commits with SSH key
    id: git-694eba5e
    cmd: git config --global gpg.format ssh && git config --global user.signingkey <key> && git config --global commit.gpgsign true
    desc: "Signs every commit with your SSH key, so your Git host can show it as verified. Add the key there as a signing key too."
    risk: warn
    args:
      - name: key
        quote: true
        desc: "Using <key>."
        placeholder: "~/.ssh/id_ed25519.pub"
  - name: Your settings
    id: git-e7c1b358
    cmd: git config --global --list --show-origin
    desc: "Lists every global Git setting and the file it's in."
