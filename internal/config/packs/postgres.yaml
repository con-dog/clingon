# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
description: Connect to, query, inspect, dump, restore and drop PostgreSQL databases
version: 1.1.0
requires: [psql]

sections:
  - name: PostgreSQL
    logo: postgres
    color: "#5f87d7"
    category: Databases
    groups:
      - name: Connect
        commands:
          - name: Connect
            id: postgresql-65dd32ab
            cmd: psql <database>
            desc: "Opens a psql prompt on a local database. \\q leaves it."
            args:
              - name: database
                quote: true
                desc: "On <database>."
                placeholder: "mydb"
          - name: Connect to a server
            id: postgresql-df15410c
            cmd: psql -h <host> -p <port> -U <user> -d <database>
            desc: "Opens a psql prompt on any PostgreSQL server, asking for the password if it needs one."
            args:
              - name: host
                desc: "On <host>"
                default: localhost
              - name: port
                desc: "port <port>,"
                default: "5432"
                pattern: "[0-9]+"
              - name: user
                desc: "as <user>,"
                default: postgres
              - name: database
                desc: "in <database>."
                default: postgres
          - name: Connect with a URL
            id: postgresql-93c43f74
            cmd: psql <url>
            desc: "Opens a psql prompt on any database, from a postgres:// URL. The URL is a secret: it never shows on screen or in your history."
            args:
              - name: url
                type: secret
                desc: "On the database at that URL."
                placeholder: postgres://user:password@host:5432/db
          - name: Is it up
            id: postgresql-f7fda60a
            cmd: pg_isready -h <host> -p <port>
            desc: "Says whether a PostgreSQL server is accepting connections."
            args:
              - name: host
                desc: "On <host>"
                default: localhost
              - name: port
                desc: "port <port>."
                default: "5432"
                pattern: "[0-9]+"
      - name: Query
        commands:
          - name: Run a query
            id: postgresql-ffd47fa2
            cmd: psql -d <database> -c <sql>
            desc: "Runs one SQL statement and prints the result."
            risk: warn
            args:
              - name: database
                quote: true
                desc: "On <database>,"
                placeholder: "mydb"
              - name: sql
                quote: true
                desc: "running <sql>."
                placeholder: SELECT * FROM users LIMIT 10
          - name: Save a query as CSV
            id: postgresql-fa66a0c6
            cmd: psql -d <database> --csv -c <sql> -o <file>
            desc: "Runs a query and writes the result to a CSV file with a header row."
            risk: warn
            args:
              - name: database
                quote: true
                desc: "On <database>,"
                placeholder: "mydb"
              - name: sql
                quote: true
                desc: "running <sql>"
                placeholder: SELECT * FROM users
              - name: file
                quote: true
                desc: "into <file>."
                placeholder: result.csv
          - name: Run a SQL file
            id: postgresql-85625e79
            cmd: psql -d <database> -v ON_ERROR_STOP=1 -f <file>
            desc: "Runs every statement in a SQL file, such as a plain pg_dump, stopping at the first error."
            risk: danger
            args:
              - name: database
                quote: true
                desc: "On <database>,"
                placeholder: "mydb"
              - name: file
                quote: true
                desc: "running <file>."
                placeholder: "path/to/file"
      - name: Inspect
        commands:
          - name: List databases
            id: postgresql-289a054e
            cmd: psql -l
            desc: "Lists the databases on the local PostgreSQL server."
          - name: Database sizes
            id: postgresql-6755810e
            cmd: psql -d postgres -c 'SELECT datname, pg_size_pretty(pg_database_size(datname)) AS size FROM pg_database ORDER BY pg_database_size(datname) DESC'
            desc: "Lists every database with how much disk it uses, biggest first."
          - name: List tables
            id: postgresql-300a7309
            cmd: psql -d <database> -c '\dt+'
            desc: "Lists the tables in a database with their sizes."
            args:
              - name: database
                quote: true
                desc: "In <database>."
                placeholder: "mydb"
          - name: Describe a table
            id: postgresql-11f7af2a
            cmd: psql -d <database> -c '\d+ '<table>
            desc: "Shows a table's columns, types, indexes and constraints."
            args:
              - name: database
                quote: true
                desc: "In <database>,"
                placeholder: "mydb"
              - name: table
                quote: true
                desc: "describing <table>."
                placeholder: "public.users"
          - name: Running queries
            id: postgresql-14589e4b
            cmd: psql -d postgres -c "SELECT pid, usename, datname, state, now() - query_start AS running_for, query FROM pg_stat_activity WHERE NOT (state = 'idle' OR pid = pg_backend_pid()) ORDER BY running_for DESC"
            desc: "Lists the queries running right now, longest first, with the pid to cancel them by."
          - name: List users
            id: postgresql-ed7640e0
            cmd: psql -d postgres -c '\du'
            desc: "Lists the users (roles) on the server and what they can do."
      - name: Manage
        commands:
          - name: New database
            id: postgresql-ee50a68a
            cmd: createdb <name>
            desc: "Creates an empty PostgreSQL database."
            risk: warn
            args:
              - name: name
                desc: "Called <name>."
                pattern: "[A-Za-z0-9_]+"
          - name: New user
            id: postgresql-be1554f1
            cmd: createuser --pwprompt <name>
            desc: "Creates a PostgreSQL user that can log in, asking for its password."
            risk: warn
            args:
              - name: name
                desc: "Called <name>."
                pattern: "[A-Za-z0-9_]+"
          - name: Disconnect everyone
            id: postgresql-f47d6f72
            cmd: psql -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '"<database>"' AND pid <> pg_backend_pid()"
            desc: "Ends every session connected to a database, so it can be dropped or renamed."
            risk: danger
            args:
              - name: database
                quote: true
                desc: "From <database>."
                placeholder: "mydb"
          - name: Drop a table
            id: postgresql-8f0367b1
            cmd: psql -d <database> -c 'DROP TABLE '<table>
            desc: "Deletes a table and every row in it."
            risk: danger
            args:
              - name: database
                quote: true
                desc: "In <database>,"
                placeholder: "mydb"
              - name: table
                quote: true
                desc: "dropping <table>."
                placeholder: "public.users"
          - name: Drop a database
            id: postgresql-f70fd15c
            cmd: dropdb <flags> <database>
            desc: "Deletes a PostgreSQL database and everything in it."
            risk: danger
            args:
              - name: database
                quote: true
                desc: "Dropping <database>."
                placeholder: "mydb"
              - name: flags
                type: flags
                options:
                  - { value: --force, label: disconnect anyone using it first (PostgreSQL 13+) }
          - name: Drop a user
            id: postgresql-bb4518e2
            cmd: dropuser <name>
            desc: "Deletes a PostgreSQL user. It fails while the user still owns anything."
            risk: danger
            args:
              - name: name
                quote: true
                desc: "Dropping <name>."
                placeholder: "name"
      - name: Back up and restore
        commands:
          - name: Dump a database
            id: postgresql-795a57eb
            cmd: pg_dump -Fc <database> -f <file>
            desc: "Writes a whole PostgreSQL database to one file that pg_restore can load. The file holds all its data, so keep it safe."
            risk: warn
            args:
              - name: database
                quote: true
                desc: "Dumping <database>"
                placeholder: "mydb"
              - name: file
                quote: true
                desc: "to <file>."
                placeholder: backup.dump
          - name: Dump as SQL
            id: postgresql-08233bcf
            cmd: pg_dump <database> -f <file>
            desc: "Writes a whole PostgreSQL database out as plain SQL that psql can run. The file holds all its data, so keep it safe."
            risk: warn
            args:
              - name: database
                quote: true
                desc: "Dumping <database>"
                placeholder: "mydb"
              - name: file
                quote: true
                desc: "to <file>."
                placeholder: backup.sql
          - name: Dump the schema only
            id: postgresql-4415f43a
            cmd: pg_dump --schema-only <database> -f <file>
            desc: "Writes a database's tables, indexes and functions out as SQL, without any rows."
            risk: warn
            args:
              - name: database
                quote: true
                desc: "Dumping <database>"
                placeholder: "mydb"
              - name: file
                quote: true
                desc: "to <file>."
                placeholder: schema.sql
          - name: Dump every database
            id: postgresql-e4ac23d3
            cmd: pg_dumpall -f <file>
            desc: "Writes every database on the server, plus its users, out as SQL. The file holds all its data, so keep it safe."
            risk: warn
            args:
              - name: file
                quote: true
                desc: "To <file>."
                placeholder: all.sql
          - name: Restore a dump
            id: postgresql-48101450
            cmd: pg_restore --clean --if-exists -d <database> <file>
            desc: "Loads a pg_dump file into a database, dropping and replacing whatever is in the dump."
            risk: danger
            args:
              - name: database
                quote: true
                desc: "Into <database>"
                placeholder: "mydb"
              - name: file
                quote: true
                desc: "from <file>."
                placeholder: "path/to/file"
          - name: Restore as a new database
            id: postgresql-71ae452b
            cmd: pg_restore --create --exit-on-error -d postgres <file>
            desc: "Creates the database a pg_dump file came from, under its old name, and loads it."
            risk: danger
            args:
              - name: file
                quote: true
                desc: "From <file>."
                placeholder: "path/to/file"
