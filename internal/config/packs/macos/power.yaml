# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Power
description: Check the battery, keep the Mac awake and put it to sleep
commands:
  - name: Battery
    id: macos-80bed48f
    cmd: pmset -g batt
    desc: "Shows the battery's charge and whether it's charging."
  - name: Keep awake
    id: macos-06dda47a
    cmd: caffeinate -dims
    desc: "Stops your Mac sleeping until you press Ctrl-C."
  - name: Keep awake for a while
    id: macos-2484014e
    cmd: caffeinate -dims -t $(( <minutes> * 60 ))
    desc: "Stops your Mac sleeping for a set time."
    args:
      - name: minutes
        desc: "For <minutes> minutes."
        default: "60"
        pattern: "[0-9]+"
  - name: Sleep now
    id: macos-c0426ad9
    cmd: pmset sleepnow
    desc: "Puts your Mac to sleep straight away."
    risk: warn
