# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Network
description: See Wi-Fi details, turn Wi-Fi on or off and flush the DNS cache
commands:
  - name: Flush DNS cache
    id: macos-2e5753e8
    cmd: sudo dscacheutil -flushcache && sudo killall -HUP mDNSResponder
    desc: "Forgets cached DNS answers, for when a site moved but your Mac still goes to the old address."
    risk: warn
  - name: Turn Wi-Fi off
    id: macos-f5b6cb44
    cmd: networksetup -setairportpower <device> off
    desc: "Switches Wi-Fi off."
    risk: warn
    args:
      - name: device
        quote: true
        placeholder: "Wi-Fi"
  - name: Turn Wi-Fi on
    id: macos-39a2c466
    cmd: networksetup -setairportpower <device> on
    desc: "Switches Wi-Fi on."
    args:
      - name: device
        quote: true
        placeholder: "Wi-Fi"
  - name: Wi-Fi details
    id: macos-36e8bbc9
    cmd: ipconfig getsummary <device>
    desc: "Shows the details of your Wi-Fi connection and your address. macOS may hide the network's name."
    args:
      - name: device
        quote: true
        placeholder: "Wi-Fi"
