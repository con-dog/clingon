# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Snapshots and flushing
description: Save a snapshot, and empty one database or delete everything
commands:
  - name: Save a snapshot
    id: redis-cf84f29b
    cmd: redis-cli --rdb <file>
    desc: "Downloads a snapshot of the whole Redis database to a file. It holds all its data, so keep it safe."
    risk: warn
    args:
      - name: file
        quote: true
        desc: "To <file>."
        placeholder: dump.rdb
  - name: Save on the server
    id: redis-2041c98a
    cmd: redis-cli bgsave
    desc: "Tells the server to write its snapshot file to disk now, in the background."
    risk: warn
  - name: Empty a database
    id: redis-e4771c8b
    cmd: redis-cli -n <db> flushdb
    desc: "Deletes every key in one Redis database."
    risk: danger
    args:
      - name: db
        desc: "Emptying database <db>."
        default: "0"
        pattern: "[0-9]+"
  - name: Delete everything
    id: redis-6aadfb13
    cmd: redis-cli flushall
    desc: "Deletes every key in every database on the Redis server."
    risk: danger
