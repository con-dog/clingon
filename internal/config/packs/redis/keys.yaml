# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Keys
description: Find, count and read keys, set expiries, delete keys, and find the biggest ones
commands:
  - name: Find keys
    id: redis-6478daa5
    cmd: redis-cli --scan --pattern <pattern>
    desc: "Lists keys matching a pattern, without blocking the server like KEYS does."
    args:
      - name: pattern
        quote: true
        desc: "Matching <pattern>."
        default: "*"
  - name: Count keys
    id: redis-20179b5d
    cmd: redis-cli dbsize
    desc: "Says how many keys are in the current database."
  - name: Get a value
    id: redis-eb7da14d
    cmd: redis-cli get <key>
    desc: "Prints the value of a string key."
    args:
      - name: key
        quote: true
        desc: "Of <key>."
  - name: Key type and expiry
    id: redis-fab4b7d4
    cmd: redis-cli type <key> && redis-cli ttl <key>
    desc: "Says what type a key is, then how many seconds it has left (-1 means it never expires)."
    args:
      - name: key
        quote: true
        desc: "For <key>."
  - name: Set an expiry
    id: redis-c4a9c883
    cmd: redis-cli expire <key> <seconds>
    desc: "Makes a key delete itself after a number of seconds."
    risk: warn
    args:
      - name: key
        quote: true
        desc: "Expiring <key>"
      - name: seconds
        desc: "in <seconds> seconds."
        default: "3600"
        pattern: "[1-9][0-9]*"
  - name: Delete a key
    id: redis-66c1273a
    cmd: redis-cli unlink <key>
    desc: "Deletes a key and its value for good."
    risk: danger
    args:
      - name: key
        quote: true
        desc: "Deleting <key>."
  - name: Biggest keys
    id: redis-9a880e87
    cmd: redis-cli --bigkeys
    desc: "Scans every key and reports the biggest of each type, without blocking the server."
  - name: Keys using most memory
    id: redis-ea621d98
    cmd: redis-cli --memkeys
    desc: "Scans every key and reports the ones using the most memory."
