# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Sessions
description: Start or resume Codex, run a one-off task, or start with a chosen model or sandbox
commands:
  - name: Start Codex
    id: codex-4293c899
    cmd: codex
    desc: "Starts an interactive Codex session in this folder."
  - name: Resume last session
    id: codex-33089c76
    cmd: codex resume --last
    desc: "Picks up your most recent Codex session in this folder where you left off."
  - name: Resume a session
    id: codex-b907b5c1
    cmd: codex resume
    desc: "Lets you choose a past Codex session to pick back up."
  - name: Run a one-off task
    id: codex-727de2d9
    cmd: codex exec <flags> <prompt>
    desc: "Gives Codex a single task to work through without a session, printing its progress and final answer."
    risk: warn
    args:
      - name: prompt
        quote: true
      - name: flags
        type: flags
        options:
          - { value: --sandbox workspace-write, label: let it edit files in this folder }
          - { value: --json, label: print events as JSON lines }
          - { value: --skip-git-repo-check, label: run outside a Git repo }
  - name: Start with a model
    id: codex-eb5a87e4
    cmd: codex --model <model>
    desc: "Starts an interactive Codex session using a model other than your default."
    args:
      - name: model
        quote: true
        desc: "Using <model>."
  - name: Start with a sandbox
    id: codex-16ce5e75
    cmd: codex --sandbox <sandbox>
    desc: "Starts an interactive Codex session that can only touch what the sandbox allows."
    risk: warn
    args:
      - name: sandbox
        options:
          - { value: read-only, label: read files only }
          - { value: workspace-write, label: edit files in this folder }
          - { value: danger-full-access, label: no sandbox at all }
