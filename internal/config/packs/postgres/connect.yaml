# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Connect
description: Connect to PostgreSQL locally, to a server or with a URL, and check that it's up
commands:
  - name: Connect
    id: postgresql-65dd32ab
    cmd: psql <database>
    desc: "Opens a psql prompt on a local database. \\q leaves it."
    args:
      - name: database
        quote: true
        desc: "On <database>."
        placeholder: "mydb"
  - name: Connect to a server
    id: postgresql-df15410c
    cmd: psql -h <host> -p <port> -U <user> -d <database>
    desc: "Opens a psql prompt on any PostgreSQL server, asking for the password if it needs one."
    args:
      - name: host
        quote: true
        desc: "On <host>"
        default: localhost
      - name: port
        desc: "port <port>,"
        default: "5432"
        pattern: "[0-9]+"
      - name: user
        quote: true
        desc: "as <user>,"
        default: postgres
      - name: database
        quote: true
        desc: "in <database>."
        default: postgres
  - name: Connect with a URL
    id: postgresql-93c43f74
    cmd: psql <url>
    desc: "Opens a psql prompt on any database, from a postgres:// URL. The URL is a secret: it never shows on screen or in your history."
    args:
      - name: url
        type: secret
        desc: "On the database at that URL."
        placeholder: postgres://user:password@host:5432/db
  - name: Is it up
    id: postgresql-f7fda60a
    cmd: pg_isready -h <host> -p <port>
    desc: "Says whether a PostgreSQL server is accepting connections."
    args:
      - name: host
        quote: true
        desc: "On <host>"
        default: localhost
      - name: port
        desc: "port <port>."
        default: "5432"
        pattern: "[0-9]+"
