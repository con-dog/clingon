# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Inspect
description: List databases, tables and users, describe a table, and see sizes and running queries
commands:
  - name: List databases
    id: postgresql-289a054e
    cmd: psql -l
    desc: "Lists the databases on the local PostgreSQL server."
  - name: Database sizes
    id: postgresql-6755810e
    cmd: psql -d postgres -c 'SELECT datname, pg_size_pretty(pg_database_size(datname)) AS size FROM pg_database ORDER BY pg_database_size(datname) DESC'
    desc: "Lists every database with how much disk it uses, biggest first."
  - name: List tables
    id: postgresql-300a7309
    cmd: psql -d <database> -c '\dt+'
    desc: "Lists the tables in a database with their sizes."
    args:
      - name: database
        quote: true
        desc: "In <database>."
        placeholder: "mydb"
  - name: Describe a table
    id: postgresql-11f7af2a
    cmd: psql -d <database> -c '\d+ '<table>
    desc: "Shows a table's columns, types, indexes and constraints."
    args:
      - name: database
        quote: true
        desc: "In <database>,"
        placeholder: "mydb"
      - name: table
        quote: true
        desc: "describing <table>."
        placeholder: "public.users"
  - name: Running queries
    id: postgresql-14589e4b
    cmd: psql -d postgres -c "SELECT pid, usename, datname, state, now() - query_start AS running_for, query FROM pg_stat_activity WHERE NOT (state = 'idle' OR pid = pg_backend_pid()) ORDER BY running_for DESC"
    desc: "Lists the queries running right now, longest first, with the pid to cancel them by."
  - name: List users
    id: postgresql-ed7640e0
    cmd: psql -d postgres -c '\du'
    desc: "Lists the users (roles) on the server and what they can do."
