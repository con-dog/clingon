# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Navigate
description: Go to a folder, or make one and go into it
commands:
  - name: Go to folder
    id: files-2b37a5f3
    cmd: cd <dir>
    desc: "Moves your shell into a folder. It stays there afterwards."
    args:
      - name: dir
        quote: true
        desc: "Into <dir>."
        placeholder: "path/to/folder"
  - name: Make a folder and go into it
    id: files-fbdd5f4a
    cmd: mkdir -p <dir> && cd <dir>
    desc: "Creates a folder, and any missing parents, then moves into it."
    args:
      - name: dir
        quote: true
        desc: "Called <dir>."
        placeholder: new-project
