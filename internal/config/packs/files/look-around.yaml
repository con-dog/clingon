# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Look around
description: List files, see a folder tree, read, follow and compare files, and count lines of code
commands:
  - name: List files
    id: files-d24e25b3
    cmd: ls -lah <flags> <dir>
    desc: "Lists everything in a folder, hidden files included, with sizes, dates and permissions."
    args:
      - name: flags
        type: flags
        options:
          - { value: -t, label: newest first }
          - { value: -S, label: biggest first }
          - { value: -R, label: subfolders too }
      - name: dir
        quote: true
        desc: "In <dir>."
        default: .
  - name: Folder tree
    id: files-ff058ee0
    cmd: find <dir> -maxdepth <depth> -not -path '*/.*' -not -path '*/node_modules*' | sort | sed 's|[^/]*/|  |g'
    desc: "Shows the folders and files below a folder as an indented tree, skipping hidden ones and node_modules."
    args:
      - name: dir
        quote: true
        desc: "Starting at <dir>."
        default: .
      - name: depth
        desc: "<depth> levels deep."
        options: ["2", "3", "1"]
        default: "2"
  - name: Recently changed files
    id: files-00197510
    cmd: find <dir> -type f -mmin -<minutes> -not -path '*/.git/*' -not -path '*/node_modules/*'
    desc: "Lists files changed recently, handy for finding what a build or a tool just wrote."
    args:
      - name: minutes
        default: "30"
        options:
          - { value: "30", label: in the last half hour }
          - { value: "60", label: in the last hour }
          - { value: "1440", label: in the last day }
      - name: dir
        quote: true
        desc: "Under <dir>."
        default: .
  - name: Peek at a file
    id: files-bb277a24
    cmd: head -n <lines> <file>
    desc: "Prints the first lines of a file."
    args:
      - name: file
        quote: true
        desc: "Of <file>."
        placeholder: "path/to/file"
      - name: lines
        quote: true
        desc: "The first <lines>."
        default: "40"
  - name: Read a file
    id: files-b83651ba
    cmd: less <file>
    desc: "Opens a file to scroll and search through. Press q to quit, / to search."
    args:
      - name: file
        quote: true
        desc: "Reading <file>."
        placeholder: "path/to/file"
  - name: Follow a file
    id: files-8660a044
    cmd: tail -f <file>
    desc: "Prints new lines as they're added to a file, like a log. Ctrl-C stops."
    args:
      - name: file
        quote: true
        desc: "Following <file>."
        placeholder: "path/to/file"
  - name: Compare two files
    id: files-4096fe0a
    cmd: diff -u <a> <b>
    desc: "Shows the lines that differ between two files."
    args:
      - name: a
        quote: true
        prompt: first file
        desc: "Between <a>"
        placeholder: "path/to/file"
      - name: b
        quote: true
        prompt: second file
        desc: "and <b>."
        placeholder: "path/to/other-file"
  - name: Count lines of code
    id: files-b1079cfd
    cmd: find . -type f -name '*.'<ext> -not -path '*/node_modules/*' -not -path '*/.git/*' -print0 | xargs -0 wc -l | sort -n | tail -n 20
    desc: "Counts lines in every file of one type and lists the 20 biggest, with the total."
    args:
      - name: ext
        quote: true
        prompt: file type
        desc: "Counting .<ext> files."
        placeholder: "txt"
