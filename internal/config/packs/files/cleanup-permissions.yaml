# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Cleanup & permissions
description: Delete files matching a pattern and make files executable
commands:
  - name: Delete files matching
    id: files-ee88568f
    cmd: find <dir> -type f -name <pattern> -print -delete
    desc: "Permanently deletes every file matching a pattern, listing each one as it goes."
    risk: danger
    args:
      - name: pattern
        quote: true
        desc: "Files named <pattern>."
        placeholder: "*.log"
      - name: dir
        quote: true
        desc: "Under <dir>."
        default: .
  - name: Make executable
    id: files-eeba4baa
    cmd: chmod +x <file>
    desc: "Makes a file runnable as a program."
    args:
      - name: file
        quote: true
        desc: "Making <file> executable."
        placeholder: "path/to/file"
