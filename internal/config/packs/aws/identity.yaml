# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Identity
description: Switch AWS profiles, see who you are, and log in and out of SSO
commands:
  - name: Use profile
    id: aws-feafb459
    cmd: export AWS_PROFILE=<profile>
    desc: "Sets which AWS account and credentials this shell uses for every aws command after it."
    args:
      - name: profile
        quote: true
        desc: "From now on that's <profile>."
        placeholder: "default"
  - name: Stop using a profile
    id: aws-b4eefb2b
    cmd: unset AWS_PROFILE
    desc: "Goes back to your default AWS profile in this shell."
  - name: Who am I
    id: aws-12ec2490
    cmd: aws sts get-caller-identity
    desc: "Shows which AWS account, user or role your current credentials belong to."
  - name: Who am I as a profile
    id: aws-48896b1e
    cmd: aws sts get-caller-identity --profile <profile>
    desc: "Shows which AWS account, user or role a profile's credentials belong to, without switching to it."
    args:
      - name: profile
        quote: true
        desc: "For the <profile> profile."
        placeholder: "default"
  - name: List profiles
    id: aws-5eea3cc7
    cmd: aws configure list-profiles
    desc: "Lists the name of every profile in your AWS config, SSO ones included."
  - name: SSO login
    id: aws-042c2d6c
    cmd: aws sso login --profile <profile>
    desc: "Signs you in through AWS SSO in your browser and caches fresh credentials."
    args:
      - name: profile
        quote: true
        desc: "For the <profile> profile."
        placeholder: "default"
  - name: SSO logout
    id: aws-3f863007
    cmd: aws sso logout
    desc: "Signs you out of AWS SSO by clearing its cached sign-ins for every profile, not just the current one."
    risk: warn
