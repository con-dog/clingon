# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Gists
description: List your gists and make a new one from a file
commands:
  - name: My gists
    id: github-7b57082e
    cmd: gh gist list
    desc: "Lists your gists."
  - name: New gist from a file
    id: github-46c6a2b8
    cmd: gh gist create <file> <flags>
    desc: "Uploads a file as a gist and prints its link. Gists are secret unless you make them public."
    risk: warn
    args:
      - name: file
        quote: true
        desc: "From <file>."
        placeholder: "path/to/file"
      - name: flags
        type: flags
        options:
          - { value: --public, label: public }
