# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Issues
description: List open issues, view one and create a new one
when: [.git]
commands:
  - name: New issue
    id: github-36df7f1a
    cmd: gh issue create
    desc: "Opens a new issue on this repository, asking for its title and body."
    risk: warn
  - name: Open issues
    id: github-1ad205b1
    cmd: gh issue list
    desc: "Lists this repository's open issues."
  - name: View an issue
    id: github-96a6b469
    cmd: gh issue view <issue> --comments
    desc: "Shows an issue and its comments."
    args:
      - name: issue
        quote: true
        placeholder: "123"
