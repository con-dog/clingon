# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
description: Search, install, remove and upgrade packages with Homebrew
version: 1.0.0
default: true

sections:
  - name: Package managers
    logo: box
    category: System
    groups:
      - name: Homebrew
        requires: [brew]
        commands:
          - name: Search
            cmd: brew search <query>
            desc: "Searches Homebrew for formulae and apps by name."
            args:
              - name: query
                quote: true
                desc: "Matching \"<query>\"."
          - name: Install
            cmd: brew install <name>
            desc: "Installs a formula or app with Homebrew."
            risk: warn
            args:
              - name: name
                desc: "Installing <name>."
                placeholder: formula or cask
          - name: Uninstall
            cmd: brew uninstall <name>
            desc: "Removes something you installed with Homebrew."
            risk: warn
            args:
              - name: name
                quote: true
                desc: "Removing <name>."
                placeholder: "package name"
          - name: Info
            cmd: brew info <name>
            desc: "Shows a package's version, dependencies and where it's installed."
            args:
              - name: name
                quote: true
                desc: "About <name>."
                placeholder: "package name"
          - name: What's outdated
            cmd: brew update && brew outdated
            desc: "Refreshes Homebrew's package list and shows what has newer versions."
          - name: Upgrade everything
            cmd: brew update && brew upgrade
            desc: "Refreshes Homebrew and upgrades everything that's out of date."
            risk: warn
          - name: Upgrade one
            cmd: brew upgrade <name>
            desc: "Upgrades one package to its latest version."
            risk: warn
            args:
              - name: name
                quote: true
                desc: "Upgrading <name>."
                placeholder: "package name"
          - name: Installed (top level)
            cmd: brew leaves -r
            desc: "Lists the packages you installed yourself, leaving out ones that came in as dependencies."
          - name: Clean up old versions
            cmd: brew cleanup
            desc: "Deletes old versions and cached downloads to free disk space."
            risk: warn
          - name: Check for problems
            cmd: brew doctor
            desc: "Checks your Homebrew setup for problems and suggests fixes."
