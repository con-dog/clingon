# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
description: Docker setup, containers, images and Compose
version: 1.0.0
requires: [docker]

sections:
  - name: Docker
    logo: docker
    color: "#0087ff"
    category: Infrastructure
    groups:

      - name: Containers
        commands:
          - name: Running containers
            cmd: docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            desc: "Lists running containers with their image, status and ports."
          - name: Shell into container
            cmd: docker exec -it <container> <shell>
            desc: "Opens an interactive shell inside a running container."
            args:
              - name: container
                quote: true
                desc: "Inside <container>."
                placeholder: "web"
              - name: shell
                desc: "Using <shell>."
                options: [sh, bash, zsh]
                default: sh
          - name: Follow logs
            cmd: docker logs -f --tail <lines> <container>
            desc: "Streams a container's logs live as they're written."
            args:
              - name: container
                quote: true
                desc: "From <container>."
                placeholder: "web"
              - name: lines
                desc: "Showing <lines> lines of history first."
                options: ["100", "1000", all]
                default: "100"
          - name: Restart container
            cmd: docker restart <container>
            desc: "Stops a container and starts it again, keeping its configuration."
            risk: warn
            args:
              - name: container
                quote: true
                desc: "Restarting <container>."
                placeholder: "web"
          - name: Remove container
            cmd: docker rm <flags> <container>
            desc: "Deletes a container for good."
            risk: danger
            args:
              - name: container
                quote: true
                desc: "Removing <container>."
                placeholder: "web"
              - name: flags
                type: flags
                options:
                  - { value: -f, label: force (stop if running) }
                  - { value: -v, label: also remove anonymous volumes }
          - name: Stop container
            cmd: docker stop <container>
            desc: "Stops a running container. It keeps its data and can be started again."
            risk: warn
            args:
              - name: container
                quote: true
                desc: "Stopping <container>."
                placeholder: "web"
          - name: Copy a file out
            cmd: docker cp <container>:<path> <dest>
            desc: "Copies a file or folder out of a container. Anything already at the destination is replaced."
            risk: warn
            args:
              - name: container
                quote: true
                desc: "From <container>"
                placeholder: "web"
              - name: path
                quote: true
                desc: "at <path>"
                placeholder: /app/logs
              - name: dest
                quote: true
                desc: "to <dest>."
                default: .
          - name: Copy a file in
            cmd: docker cp <file> <container>:<path>
            desc: "Copies a file into a container. Anything already at that path is replaced."
            risk: warn
            args:
              - name: file
                quote: true
                desc: "Copying <file>"
                placeholder: "path/to/file"
              - name: container
                quote: true
                desc: "into <container>"
                placeholder: "web"
              - name: path
                quote: true
                desc: "at <path>."
                placeholder: /tmp/
          - name: Inspect container
            cmd: docker inspect <container>
            desc: "Shows everything Docker knows about a container: its config, mounts, network and state."
            args:
              - name: container
                quote: true
                desc: "For <container>."
                placeholder: "web"
          - name: Container stats
            cmd: docker stats --no-stream
            desc: "Shows each running container's CPU, memory, network and disk use right now."

      - name: Images
        commands:
          - name: Run image
            cmd: docker run --rm -it <flags> <image> <command>
            desc: "Starts a throwaway container from an image and drops you into it. It's deleted when you exit."
            args:
              - name: image
                quote: true
                desc: "From <image>."
                placeholder: "nginx:latest"
              - name: flags
                type: flags
                options:
                  - { value: '-v "$PWD":/work -w /work', label: mount current dir }
                  - { value: --network host, label: host network }
                  - { value: --entrypoint sh, label: override entrypoint }
              - name: command
                desc: "Running <command> instead of the image's default."
                optional: true
                placeholder: e.g. sh
          - name: Build image
            cmd: docker build -t <tag> .
            when: [./Dockerfile]
            desc: "Builds an image from the Dockerfile in this folder."
            args:
              - name: tag
                quote: true
                desc: "Tagged <tag>."
                placeholder: myapp:dev
          - name: Prune unused data
            cmd: docker system prune -af <volumes>
            desc: "Deletes every stopped container, unused image, network and build cache to free disk space."
            risk: danger
            args:
              - name: volumes
                type: flags
                options:
                  - { value: --volumes, label: anonymous volumes too }
          - name: Disk usage
            cmd: docker system df
            desc: "Shows how much disk space images, containers, volumes and build cache take up."
          - name: Pull image
            cmd: docker pull <image>
            desc: "Downloads an image from its registry."
            args:
              - name: image
                quote: true
                desc: "Pulling <image>."
                placeholder: postgres:17
          - name: List images
            cmd: docker images
            desc: "Lists the images on this machine with their tags and sizes."

      - name: Compose
        when: [compose.yaml, compose.yml, docker-compose.yml, docker-compose.yaml]
        commands:
          - name: Up (detached)
            cmd: docker compose up -d <services>
            desc: "Starts your Compose services in the background, building or pulling images if needed."
            risk: warn
            args:
              - name: services
                desc: "Only <services>."
                optional: true
                placeholder: "web db, or enter for all"
          - name: Follow service logs
            cmd: docker compose logs -f --tail 100 <service>
            desc: "Streams one Compose service's logs live, starting from the last 100 lines."
            args:
              - name: service
                quote: true
                desc: "From <service>."
                placeholder: "web"
          - name: Down
            cmd: docker compose down <flags>
            desc: "Stops your Compose services and removes their containers and networks."
            risk: warn
            args:
              - name: flags
                type: flags
                options:
                  - { value: --remove-orphans, label: remove orphan containers }
          - name: Down and delete volumes
            cmd: docker compose down -v
            desc: "Stops your Compose services and deletes their containers, networks and volumes: any data in those volumes, like a database's, is gone."
            risk: danger
          - name: Status
            cmd: docker compose ps
            desc: "Shows your Compose services' containers and whether they're running."
          - name: Rebuild and start
            cmd: docker compose up -d --build <services>
            desc: "Rebuilds your Compose images from source, then starts the services in the background."
            risk: warn
            args:
              - name: services
                desc: "Only <services>."
                optional: true
                placeholder: "web db, or enter for all"
          - name: Restart a service
            cmd: docker compose restart <service>
            desc: "Restarts one Compose service's containers without rebuilding them."
            risk: warn
            args:
              - name: service
                quote: true
                desc: "Restarting <service>."
                placeholder: "web"
          - name: Shell into a service
            cmd: docker compose exec <service> sh
            desc: "Opens a shell inside a running Compose service."
            args:
              - name: service
                quote: true
                desc: "Inside <service>."
                placeholder: "web"

      - name: Setup
        commands:
          - name: Check it works
            cmd: docker run --rm hello-world
            desc: "Runs Docker's tiny test image, which prints a message if everything is set up."
          - name: Log in to a registry
            cmd: docker login <registry>
            desc: "Signs you in to a registry so you can push images and pull private ones."
            args:
              - name: registry
                desc: "At <registry>."
                optional: true
                placeholder: "ghcr.io, or enter for Docker Hub"
          - name: Start Docker
            cmd: open -a Docker
            desc: "Starts Docker Desktop. docker commands work once its whale icon stops animating."
            requires: [open, ipconfig]   # macOS

      - name: Networks
        commands:
          - name: Inspect a network
            cmd: docker network inspect <network>
            desc: "Shows a network's settings and which containers are on it."
            args:
              - name: network
                quote: true
                desc: "For <network>."
                placeholder: "my-network"
          - name: List networks
            cmd: docker network ls
            desc: "Lists Docker's networks."
          - name: Remove unused networks
            cmd: docker network prune -f
            desc: "Deletes every network no container is using."
            risk: warn

      - name: Volumes
        commands:
          - name: List volumes
            cmd: docker volume ls
            desc: "Lists Docker's volumes, where containers keep data that outlives them."
          - name: Remove a volume
            cmd: docker volume rm <volume>
            desc: "Deletes a volume and every file in it."
            risk: danger
            args:
              - name: volume
                quote: true
                desc: "Deleting <volume>."
                placeholder: "my-volume"
          - name: Remove unused volumes
            cmd: docker volume prune -af
            desc: "Deletes every volume no container is using, and every file in them."
            risk: danger
          - name: Volume details
            cmd: docker volume inspect <volume>
            desc: "Shows where a volume lives and how it was made."
            args:
              - name: volume
                quote: true
                desc: "For <volume>."
                placeholder: "my-volume"
