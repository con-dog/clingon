# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Entity Framework
description: Add, list, apply and remove EF Core migrations, make a SQL script and drop the database
when: ['./*.csproj', './*.fsproj', './*.sln', './*.slnx']
commands:
  - name: Add a migration
    id: net-15902926
    cmd: dotnet ef migrations add <name>
    desc: "Writes a migration for the model changes since the last one."
    args:
      - name: name
        quote: true
        desc: "Called <name>."
        placeholder: AddOrders
  - name: Drop the database
    id: net-01c9faaf
    cmd: dotnet ef database drop
    desc: "Deletes the database and all its data."
    risk: danger
  - name: List migrations
    id: net-57c90ff7
    cmd: dotnet ef migrations list
    desc: "Lists the migrations, marking those not applied to the database yet."
  - name: Migrate to a migration
    id: net-8d96bf1a
    cmd: dotnet ef database update <migration>
    desc: "Moves the database to a given migration, undoing any after it, which can delete columns and their data."
    risk: danger
    args:
      - name: migration
        quote: true
        desc: "To <migration>."
        placeholder: "AddUsers"
  - name: Remove the last migration
    id: net-1536bfcb
    cmd: dotnet ef migrations remove
    desc: "Deletes the newest migration's files, if it isn't applied to the database yet."
    risk: warn
  - name: SQL script
    id: net-f94de60f
    cmd: dotnet ef migrations script --idempotent
    desc: "Prints the SQL for every migration, safe to run on a database at any version."
  - name: Update the database
    id: net-22ef691c
    cmd: dotnet ef database update
    desc: "Applies every migration the database doesn't have yet."
    risk: warn
