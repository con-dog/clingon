# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Build & run
description: Restore, build, run, watch, format, clean and publish a .NET project
when: ['./*.csproj', './*.fsproj', './*.sln', './*.slnx']
commands:
  - name: Build
    id: net-3230e716
    cmd: dotnet build
    desc: "Restores packages and compiles the project or solution."
  - name: Clean
    id: net-75fdfa16
    cmd: dotnet clean
    desc: "Deletes what the last build made."
    risk: warn
  - name: Format
    id: net-e2818502
    cmd: dotnet format
    desc: "Reformats the code to match the project's .editorconfig style."
    risk: warn
  - name: Publish
    id: net-646daadd
    cmd: dotnet publish -c <config> -r <rid> <flags>
    desc: "Builds the app ready to deploy, into bin/<config>/…/publish."
    risk: warn
    args:
      - name: config
        desc: "As <config>"
        options: [Release, Debug]
        default: Release
      - name: rid
        desc: "for <rid>."
        options: [linux-x64, linux-arm64, linux-musl-x64, osx-arm64, osx-x64, win-x64, win-arm64]
      - name: flags
        type: flags
        options:
          - { value: --self-contained, label: include the .NET runtime }
          - { value: -p:PublishSingleFile=true, label: single file }
  - name: Restore
    id: net-6884df3e
    cmd: dotnet restore
    desc: "Downloads the NuGet packages the project needs."
  - name: Run
    id: net-b810cc50
    cmd: dotnet run
    desc: "Builds and runs the project in this folder."
  - name: Watch and run
    id: net-c74ee68e
    cmd: dotnet watch run
    desc: "Runs the project and rebuilds or hot-reloads it whenever you save a file."
