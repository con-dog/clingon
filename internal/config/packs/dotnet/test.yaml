# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: Test
description: Run .NET tests, all of them or just those matching a filter, once or on every change
when: ['./*.csproj', './*.fsproj', './*.sln', './*.slnx']
commands:
  - name: Test
    id: net-22910ee3
    cmd: dotnet test
    desc: "Builds and runs every test project."
  - name: Test matching
    id: net-f258f850
    cmd: dotnet test --filter <filter>
    desc: "Runs only the tests that match a filter."
    args:
      - name: filter
        quote: true
        desc: "Matching <filter>."
        placeholder: FullyQualifiedName~OrderTests
  - name: Watch tests
    id: net-b2447214
    cmd: dotnet watch test
    desc: "Runs the tests again whenever you save a file."
