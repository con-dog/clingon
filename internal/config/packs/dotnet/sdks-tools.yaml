# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
name: SDKs & tools
description: See installed SDKs and environment info, manage global tools and trust the dev certificate
commands:
  - name: Check for updates
    id: net-e8bc2f94
    cmd: dotnet sdk check
    desc: "Shows which installed SDKs and runtimes are out of date or out of support."
  - name: Info
    id: net-f81703f9
    cmd: dotnet --info
    desc: "Shows which SDK is in use here, and every SDK and runtime installed."
  - name: Install a global tool
    id: net-6528237f
    cmd: dotnet tool install --global <tool>
    desc: "Installs a .NET tool for every project."
    risk: warn
    args:
      - name: tool
        quote: true
        desc: "Installing <tool>."
        placeholder: dotnet-outdated-tool
  - name: Install the EF Core tool
    id: net-f288f649
    cmd: dotnet tool install --global dotnet-ef
    desc: "Installs the dotnet ef command that Entity Framework migrations need."
    risk: warn
  - name: Installed SDKs
    id: net-e9ce1cc3
    cmd: dotnet --list-sdks
    desc: "Lists every .NET SDK installed and where."
  - name: Trust the dev certificate
    id: net-6f69dc3d
    cmd: dotnet dev-certs https --trust
    desc: "Makes a local HTTPS certificate and trusts it, so https://localhost works without warnings."
    risk: warn
  - name: Update a global tool
    id: net-d1f0209f
    cmd: dotnet tool update --global <tool>
    desc: "Updates a global .NET tool to its latest version."
    risk: warn
    args:
      - name: tool
        quote: true
        desc: "Updating <tool>."
        placeholder: "dotnet-ef"
