# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
description: npm, pnpm, yarn and bun, each where its lockfile is
version: 1.0.0
requires: [node]

# One group per package manager. Each only shows if you have that manager,
# and is greyed out except where its lockfile is, so in any project only
# the right one can be used.
sections:
  - name: Node
    logo: node
    color: "#5faf5f"
    category: Code
    groups:
      - name: bun
        requires: [bun]
        when: [bun.lock, bun.lockb]
        commands:
          - name: Add a package
            cmd: bun add <flags> <package>
            desc: "Adds a package to package.json and installs it."
            args:
              - name: package
                desc: "Adding <package>."
              - name: flags
                type: flags
                options:
                  - { value: -d, label: dev dependency }
          - name: Clean install (CI)
            cmd: bun install --frozen-lockfile
            desc: "Installs exactly what bun.lock lists, and fails if package.json has moved on from it. Best for CI."
          - name: Install dependencies
            cmd: bun install
            desc: "Installs every dependency in package.json."
          - name: Outdated packages
            cmd: bun outdated
            desc: "Lists dependencies with newer versions available."
          - name: Remove a package
            cmd: bun remove <package>
            desc: "Takes a dependency out of package.json and node_modules."
            risk: warn
            args:
              - name: package
                quote: true
                desc: "Removing <package>."
                placeholder: "lodash"
          - name: Run a script
            cmd: bun run <script>
            desc: "Runs one of the scripts in package.json."
            args:
              - name: script
                quote: true
                placeholder: "test"
          - name: Run tests
            cmd: bun test
            desc: "Runs the tests with bun's test runner."
          - name: Update dependencies
            cmd: bun update
            desc: "Updates dependencies to the newest versions package.json allows."
            risk: warn
      - name: New project
        commands:
          - name: Run a package without installing
            cmd: npx <package>
            desc: "Downloads a package's command if needed and runs it."
            requires: [npx]
            args:
              - name: package
                desc: "Running <package>."
                placeholder: create-vite@latest
          - name: Start a bun project
            cmd: bun init -y
            desc: "Creates package.json, tsconfig.json and an index.ts here, set up for bun."
            requires: [bun]
          - name: Start a pnpm project
            cmd: pnpm init && pnpm install
            desc: "Creates a package.json and lockfile here, for pnpm."
            requires: [pnpm]
          - name: Start an npm project
            cmd: npm init -y && npm install
            desc: "Creates a package.json and lockfile here, with the usual defaults."
            requires: [npm]
      - name: npm
        requires: [npm]
        when: [package-lock.json, npm-shrinkwrap.json]
        commands:
          - name: Add a package
            cmd: npm install <flags> <package>
            desc: "Adds a package to package.json and installs it."
            args:
              - name: package
                desc: "Adding <package>."
              - name: flags
                type: flags
                options:
                  - { value: -D, label: dev dependency }
          - name: Clean install (CI)
            cmd: npm ci
            desc: "Deletes node_modules and installs exactly what package-lock.json lists. Best for CI and clean checkouts."
            risk: warn
          - name: Clean reinstall
            cmd: rm -rf node_modules && npm install
            desc: "Deletes node_modules and installs every dependency again from scratch."
            risk: warn
          - name: Install dependencies
            cmd: npm install
            desc: "Installs every dependency in package.json."
          - name: Outdated packages
            cmd: npm outdated
            desc: "Lists dependencies with newer versions available."
          - name: Remove a package
            cmd: npm uninstall <package>
            desc: "Takes a dependency out of package.json and node_modules."
            risk: warn
            args:
              - name: package
                quote: true
                desc: "Removing <package>."
                placeholder: "lodash"
          - name: Run a script
            cmd: npm run <script>
            desc: "Runs one of the scripts in package.json."
            args:
              - name: script
                quote: true
                placeholder: "test"
          - name: Run tests
            cmd: npm test
            desc: "Runs the project's test script."
          - name: Security audit
            cmd: npm audit
            desc: "Checks your dependencies for known security problems."
          - name: Top-level dependencies
            cmd: npm ls --depth=0
            desc: "Lists the project's direct dependencies and the versions installed."
          - name: Update dependencies
            cmd: npm update
            desc: "Updates dependencies to the newest versions package.json allows."
            risk: warn
      - name: pnpm
        requires: [pnpm]
        when: [pnpm-lock.yaml]
        commands:
          - name: Add a package
            cmd: pnpm add <flags> <package>
            desc: "Adds a package to package.json and installs it."
            args:
              - name: package
                desc: "Adding <package>."
              - name: flags
                type: flags
                options:
                  - { value: -D, label: dev dependency }
          - name: Clean install (CI)
            cmd: pnpm install --frozen-lockfile
            desc: "Installs exactly what pnpm-lock.yaml lists, and fails if package.json has moved on from it. Best for CI."
          - name: Install dependencies
            cmd: pnpm install
            desc: "Installs every dependency in package.json."
          - name: Outdated packages
            cmd: pnpm outdated
            desc: "Lists dependencies with newer versions available."
          - name: Remove a package
            cmd: pnpm remove <package>
            desc: "Takes a dependency out of package.json and node_modules."
            risk: warn
            args:
              - name: package
                quote: true
                desc: "Removing <package>."
                placeholder: "lodash"
          - name: Run a package without installing
            cmd: pnpm dlx <package>
            desc: "Downloads a package's command if needed and runs it."
            args:
              - name: package
                desc: "Running <package>."
                placeholder: create-vite@latest
          - name: Run a script
            cmd: pnpm run <script>
            desc: "Runs one of the scripts in package.json."
            args:
              - name: script
                quote: true
                placeholder: "test"
          - name: Run tests
            cmd: pnpm test
            desc: "Runs the project's test script."
          - name: Security audit
            cmd: pnpm audit
            desc: "Checks your dependencies for known security problems."
          - name: Top-level dependencies
            cmd: pnpm list --depth=0
            desc: "Lists the project's direct dependencies and the versions installed."
          - name: Update dependencies
            cmd: pnpm update
            desc: "Updates dependencies to the newest versions package.json allows."
            risk: warn
      - name: yarn
        requires: [yarn]
        when: [yarn.lock]
        commands:
          - name: Add a package
            cmd: yarn add <flags> <package>
            desc: "Adds a package to package.json and installs it."
            args:
              - name: package
                desc: "Adding <package>."
              - name: flags
                type: flags
                options:
                  - { value: -D, label: dev dependency }
          - name: Install dependencies
            cmd: yarn install
            desc: "Installs every dependency in package.json."
          - name: Remove a package
            cmd: yarn remove <package>
            desc: "Takes a dependency out of package.json and node_modules."
            risk: warn
            args:
              - name: package
                quote: true
                desc: "Removing <package>."
                placeholder: "lodash"
          - name: Run a script
            cmd: yarn run <script>
            desc: "Runs one of the scripts in package.json."
            args:
              - name: script
                quote: true
                placeholder: "test"
          - name: Run tests
            cmd: yarn test
            desc: "Runs the project's test script."
          - name: Why is this installed
            cmd: yarn why <package>
            desc: "Shows which of your dependencies pulls a package in."
            args:
              - name: package
                desc: "For <package>."
                placeholder: lodash
