# yaml-language-server: $schema=https://raw.githubusercontent.com/con-dog/clingon/main/schema.json
#
# A submenu of your clingon pack: one file for each. Change the example below
# into your commands, then Ctrl-S to save and Ctrl-Q to quit; clingon tells you
# if anything's wrong.
#
# Each <blank> in a cmd is asked for when you run it. Give it an entry
# under args to say how:
#
#   - name: who                 # type it (add default:, placeholder:, optional: true)
#   - name: shell               # pick one
#     options: [bash, zsh]
#   - name: flags               # tick any number
#     type: flags
#     options: [-v, -f]
#
# risk: warn marks a command with ⚠ and asks No/Yes before it runs: use it
# for anything that changes or stops things but can be put right. risk:
# danger marks it ☠ in red, and you type a random code before the
# No/Yes: use it for anything that destroys data for good. when: [.git]
# greys a command out unless .git is in the shell's folder or one above.
# See the built-in packs in ../../remote for more.

name: Examples                   # a heading in the menu
description: Friendly examples   # what's in this submenu
commands:
  - name: Say hello              # what the menu shows
    cmd: echo "Hello, <who>."    # what runs
    desc: Prints a greeting.     # shown in the Description area
    args:
      - name: who
        default: world
