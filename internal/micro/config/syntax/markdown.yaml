# clingon's packs: only the Markdown a pack uses, in the menu's colours.
# Anything a pack doesn't allow is drawn as an error, so it shows as you type.
filetype: markdown

detect:
    filename: "\\.md$"

rules:
    # Text with a mark of its own; plain text stays the default colour.
    - statement: "^\\s*- "
    # A choice's mark: its ( ) or [ ] lavender, the x picking it plain, as text
    # is (later rules win: the whole mark, then the x, then its opening
    # bracket again, then the bullet).
    - special.mark: "^\\s*- (\\([ x]\\)|\\[[ x]\\])"
    - special.tick: "^\\s*- [(\\[]x"
    - special.mark: "^\\s*- [(\\[]"
    - statement: "^\\s*- "
    - constant.string: "`[^`]*`"
    - special.blank: "`<[A-Za-z_][A-Za-z0-9_-]*>`"
    - comment: "^>.*$"
    - special.warning: "^> \\[!WARNING\\]\\s*$"
    - special.caution: "^> \\[!CAUTION\\]\\s*$"
    - special.heading: "^#{1,2} .*$"
    - special.hash: "^#{1,2} "

    # Not part of a pack: other bullets, smaller headings, numbered lists,
    # bold and italics, and other callouts.
    - error: "^\\s*[*+] "
    - error: "^\\s*[0-9]+[.)] "
    - error: "^#{3,}.*$"
    - error: "\\*\\*[^*]+\\*\\*|__[^_]+__"
    - error: "^> \\[!(NOTE|TIP|IMPORTANT)\\].*$"

    # The command: coloured as the menu colours it (internal/ui/highlight.go):
    # programs green, flags periwinkle, strings tan, operators grey, blanks sky blue.
    - default:
        start: "^```[a-z]*"
        end: "^```"
        rules:
            - special.program: "^\\s*[A-Za-z0-9_./~$][A-Za-z0-9_./~$-]*"
            - special.program: "(\\|\\||&&|\\||;)\\s*[A-Za-z0-9_./~$][A-Za-z0-9_./~$-]*"
            - special.program: "\\b(sudo|exec|time|nohup|xargs|env)\\s+[A-Za-z0-9_./~$][A-Za-z0-9_./~$-]*"
            - identifier: "(^|\\s)--?[A-Za-z0-9_=.:,/-]*"
            - symbol: "\\|\\||&&|\\||;|>>?|<"
            - constant.string: "\"(\\\\.|[^\"\\\\])*\"|'[^']*'"
            - special.blank: "<[A-Za-z_][A-Za-z0-9_-]*>"
            - identifier: "\\b(needs|when)="

    # Front matter: settings for the whole file, their values plain text.
    - comment:
        start: "^---$"
        end: "^---$"
        rules:
            - special.value: "^[a-z]+:.*$"
            - identifier: "^[a-z]+:"

    - comment:
        start: "<!--"
        end: "-->"
        rules: []
