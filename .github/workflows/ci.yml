name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The tmux tests run a real private tmux server; without it they skip.
      - run: brew install tmux
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
